<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Girlfriend</title>
</head>
<body class="homeBody">
  <nav class="homeNavBar">
    <input type="text" class="homeInput" placeholder="search...">
    <img src="./Images/splashScreen.jpg" alt="Profile picture" class="homeProfilePic">
  </nav>
  <nav class="homeSideNavBar">
    <div class="sideBarItem">
    <i class="fa-solid fa-house fa-xl"></i><span>Home</span>
    </div>
    <div class="sideBarItem">
      <i class="fa-solid fa-border-all fa-xl"></i><span>Saved</span>
    </div>
    <div class="sideBarItem" id="AddButton">
      <i class="fa-regular fa-square-plus fa-xl"></i><span>Create</span>
    </div>
    <div class="sideBarItem">
      <i class="fa-regular fa-bell fa-xl"></i><span>Updates</span>
    </div>
    <div class="sideBarItem sideBarBottom settings">
      <i class="fa-solid fa-gear fa-xl"></i><span>Settings</span>
    </div>
  </nav>
  <input type="file" id="imageUpload" accept="image/*" style="display:none">
  <main class="imageGrid">
    
  </main>
</body>
<script src="home.js"></script>
</html>
